name: DWD Live Extremtemperaturen

permissions:
  contents: write

on:
  workflow_dispatch:
  repository_dispatch:
    types: [live-extrem-temps-update]

jobs:
  run-extreme-temperature-maps:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate extreme temperature maps
        run: |
          python ./live/live_extrem_temps.py

      - name: Check generated files
        run: |
          test -f ./live/output/extrema_txk.png
          test -f ./live/output/extrema_tnk.png

      - name: Commit and push PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ./live/output/extrema_txk.png
          git add ./live/output/extrema_tnk.png

          git diff --cached --quiet || git commit -m "DWD Live-Extremtemperaturkarten aktualisieren"

          git push
