
name: DWD MOSMIX Forecast Maps CH AT

permissions:
  contents: write

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - mosmix-ch-at-update

# Verhindert parallele Läufe dieses Workflows.
concurrency:
  group: dwd-mosmix-ch-at
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 1. REPOSITORY AUSCHECKEN
      # ------------------------------------------------------

      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # 2. PYTHON EINRICHTEN
      # ------------------------------------------------------

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ------------------------------------------------------
      # 3. ABHÄNGIGKEITEN INSTALLIEREN
      # ------------------------------------------------------

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ------------------------------------------------------
      # 4. MOSMIX-KARTEN ERSTELLEN
      # ------------------------------------------------------

      - name: MOSMIX-Karten erstellen
        run: |
          python mosmix_ch_at/code/main.py

      # ------------------------------------------------------
      # 5. ERZEUGTE GRAFIKEN PRÜFEN
      # ------------------------------------------------------

      - name: Erzeugte Grafiken prüfen
        run: |

          OUTPUT_DIR="mosmix_ch_at/output"

          for COUNTRY in ch at; do

            COUNTRY_DIR="$OUTPUT_DIR/$COUNTRY"

            if [ ! -d "$COUNTRY_DIR" ]; then
              echo "Ausgabeordner fehlt: $COUNTRY_DIR"
              exit 1
            fi

            count=$(find "$COUNTRY_DIR" -maxdepth 1 -type f -name '*.png' | wc -l)

            if [ "$count" -eq 0 ]; then
              echo "Keine Grafiken gefunden in $COUNTRY_DIR"
              exit 1
            fi

            echo "$COUNTRY: $count Grafiken erfolgreich erzeugt."

            ls -lh "$COUNTRY_DIR"

          done

      # ------------------------------------------------------
      # 6. GITHUB IDENTITÄT KONFIGURIEREN
      # ------------------------------------------------------

      - name: Git konfigurieren
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      # ------------------------------------------------------
      # 7. GRAFIKEN COMMITTEN
      # ------------------------------------------------------

      - name: Grafiken committen
        run: |

          git add mosmix_ch_at/output/ch/
          git add mosmix_ch_at/output/at/

          if git diff --cached --quiet; then

            echo "Keine Änderungen an den Prognosekarten."

          else

            git commit -m "DWD MOSMIX Schweiz und Österreich aktualisieren"

          fi

      # ------------------------------------------------------
      # 8. AKTUELLEN REMOTE-STAND ÜBERNEHMEN
      # ------------------------------------------------------

      - name: Remote-Änderungen integrieren und pushen
        run: |

          BRANCH="${GITHUB_REF_NAME}"

          # Mehrere Versuche, falls während des Pushens
          # ein anderer Workflow ebenfalls Änderungen überträgt.

          for attempt in 1 2 3 4 5; do

            echo "Push-Versuch $attempt von 5"

            git fetch origin "$BRANCH"

            git rebase "origin/$BRANCH"

            if git push origin "HEAD:$BRANCH"; then

              echo "Prognosekarten erfolgreich übertragen."
              exit 0

            fi

            echo "Push fehlgeschlagen. Neuer Versuch folgt."

            sleep 3

          done

          echo "Push nach 5 Versuchen fehlgeschlagen."
          exit 1
