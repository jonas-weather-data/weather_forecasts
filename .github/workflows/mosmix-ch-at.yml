name: DWD MOSMIX Forecast Maps CH AT

permissions:
  contents: write

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - mosmix-update-ch-at

# Verhindert parallele Läufe.
concurrency:
  group: dwd-mosmix-ch-at
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 1. REPOSITORY AUSCHECKEN
      # ------------------------------------------------------

      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # 2. PYTHON EINRICHTEN
      # ------------------------------------------------------

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ------------------------------------------------------
      # 3. ABHÄNGIGKEITEN INSTALLIEREN
      # ------------------------------------------------------

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ------------------------------------------------------
      # 4. MOSMIX-KARTEN ERSTELLEN
      # ------------------------------------------------------

      - name: MOSMIX-Karten für Schweiz und Österreich erstellen
        run: |
          python mosmix_ch_at/code/main.py

      # ------------------------------------------------------
      # 5. ERZEUGTE GRAFIKEN PRÜFEN
      # ------------------------------------------------------

      - name: Erzeugte Grafiken prüfen
        run: |

          CH_OUTPUT_DIR="mosmix_ch_at/output/ch"
          AT_OUTPUT_DIR="mosmix_ch_at/output/at"

          # Schweiz prüfen

          if [ ! -d "$CH_OUTPUT_DIR" ]; then
            echo "Ausgabeordner Schweiz fehlt."
            exit 1
          fi

          ch_count=$(find "$CH_OUTPUT_DIR" -maxdepth 1 -type f -name '*.png' | wc -l)

          if [ "$ch_count" -eq 0 ]; then
            echo "Keine Grafiken für die Schweiz erzeugt."
            exit 1
          fi

          echo "$ch_count Grafiken für die Schweiz erfolgreich erzeugt."

          # Österreich prüfen

          if [ ! -d "$AT_OUTPUT_DIR" ]; then
            echo "Ausgabeordner Österreich fehlt."
            exit 1
          fi

          at_count=$(find "$AT_OUTPUT_DIR" -maxdepth 1 -type f -name '*.png' | wc -l)

          if [ "$at_count" -eq 0 ]; then
            echo "Keine Grafiken für Österreich erzeugt."
            exit 1
          fi

          echo "$at_count Grafiken für Österreich erfolgreich erzeugt."

          # Gesamtübersicht

          echo ""
          echo "Schweiz:"
          ls -lh "$CH_OUTPUT_DIR"

          echo ""
          echo "Österreich:"
          ls -lh "$AT_OUTPUT_DIR"

          echo ""
          echo "Gesamt: $((ch_count + at_count)) Grafiken erfolgreich erzeugt."

      # ------------------------------------------------------
      # 6. GITHUB IDENTITÄT KONFIGURIEREN
      # ------------------------------------------------------

      - name: Git konfigurieren
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      # ------------------------------------------------------
      # 7. GRAFIKEN COMMITTEN UND PUSHEN
      # ------------------------------------------------------

      - name: Grafiken committen und pushen
        run: |

          git add mosmix_ch_at/output/ch/
          git add mosmix_ch_at/output/at/

          if git diff --cached --quiet; then

            echo "Keine Änderungen an den Prognosekarten."

          else

            git commit -m "DWD MOSMIX-Prognosekarten Schweiz und Österreich aktualisieren"

            git push origin "HEAD:${GITHUB_REF_NAME}"

            echo "Prognosekarten für Schweiz und Österreich erfolgreich ins Repository übertragen."

          fi
