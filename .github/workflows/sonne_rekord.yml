name: DWD Monatsbilanz

permissions:
  contents: write

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sonne-rekord-update]

jobs:
  run-monatsbilanz:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas geopandas matplotlib numpy

      - name: Generate sunshine maps
        run: |
          python ./monatsbilanz/sunshine_record_map.py

      - name: Check generated files
        shell: pwsh
        run: |
          Get-ChildItem .\monatsbilanz\output

          if (!(Test-Path .\monatsbilanz\output\sunshine_2026.png)) {
            Write-Error "sunshine_2026.png wurde nicht erzeugt."
          }

          if (!(Test-Path .\monatsbilanz\output\sunshine_records.png)) {
            Write-Error "sunshine_records.png wurde nicht erzeugt."
          }

          if (!(Test-Path .\monatsbilanz\output\sunshine_remaining.png)) {
            Write-Error "sunshine_remaining.png wurde nicht erzeugt."
          }

      - name: Commit and push PNGs
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ./monatsbilanz/output/sunshine_2026.png
          git add ./monatsbilanz/output/sunshine_records.png
          git add ./monatsbilanz/output/sunshine_remaining.png

          git commit -m "DWD Sonnenschein-Karten aktualisieren" `
            || Write-Host "Keine Änderungen vorhanden."

          git push
