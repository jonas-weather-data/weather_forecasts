
name: DWD MOSMIX Forecast Maps

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: MOSMIX-Karten erstellen
        run: python weather_forecasts/mosmix/code/main.py

      - name: Grafiken speichern
        uses: actions/upload-artifact@v4
        with:
          name: mosmix-germany
          path: weather_forecasts/mosmix/output/germany/
