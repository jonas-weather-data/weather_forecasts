
name: DWD MOSMIX Forecast Maps

permissions:
  contents: write

on:
  workflow_dispatch:
  repository_dispatch:
    types: [mosmix-update]

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: MOSMIX-Karten erstellen
        run: python mosmix/code/main.py

      - name: Erzeugte Grafiken prüfen
        run: |
          if [ ! -d mosmix/output/germany ]; then
            echo "Ausgabeordner fehlt."
            exit 1
          fi

          count=$(find mosmix/output/germany -maxdepth 1 -name '*.png' | wc -l)

          if [ "$count" -eq 0 ]; then
            echo "Keine Grafiken erzeugt."
            exit 1
          fi

          echo "$count Grafiken erzeugt."

      - name: Grafiken committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mosmix/output/germany/

          git commit -m "DWD MOSMIX-Prognosekarten aktualisieren" \
            || echo "Keine Änderungen vorhanden."

          git push origin HEAD:main
